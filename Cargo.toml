[package]
name = "audio-meter-rs"
version = "1.6.4"
edition = "2024"
description = "Real-time audio meter and level history viewer."

[dependencies]
anyhow = "1"
cpal = "0.17"
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.34"
env_logger = "0.11"
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
ebur128 = "0.1"
realfft = "3"
hound = "3.5"
chrono = "0.4"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
wasapi = "0.23"

[build-dependencies]
ico = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
