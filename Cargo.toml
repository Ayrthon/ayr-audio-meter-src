[package]
name = "audio-meter-rs"
version = "2.1.1"
edition = "2024"
description = "Real-time audio meter and level history viewer."

[dependencies]
anyhow = "1"
cpal = "0.17"
egui = "0.34"
env_logger = "0.11"
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
ebur128 = "0.1"
realfft = "3"
hound = "3.5"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP client for the in-app update check (GitHub Releases API) and
# Lemon Squeezy license keys API (`src/license.rs`). Kept on default features
# (`tls` via rustls + webpki-roots, `json`, `gzip`) so HTTPS to api.github.com
# / objects.githubusercontent.com / api.lemonsqueezy.com works with zero
# per-platform TLS config. No async runtime pulled in.
ureq = { version = "2", features = ["json"] }
# SHA-256 used to hash the (MachineGuid, Windows user) pair into the per-device
# `instance_name` we send to Lemon Squeezy at activation time. Salted + hex
# encoded so the raw machine/user identifiers never leave the device.
sha2 = "0.10"
# Shared wire format + mDNS discovery helpers used to accept PCM from the
# companion AYR Audio Link sender over the LAN.
#
# Lives in a separate repo (`Ayrthon/ayr-audio-link`) because Link is its
# own product with its own release cadence. Pulled as a git dep so fresh
# clones of this repo (and CI) build without needing a Link checkout.
#
# For local development against an unpublished change in Link, temporarily
# swap this for a path dep against a sibling checkout:
#
# Pinned to the local sibling checkout while the v4 protocol (M3 multicast +
# SAP) stabilises. Flip back to a git dep once the Link repo has a tag:
#   ayr-audio-link-core = { git = "https://github.com/Ayrthon/ayr-audio-link", branch = "main" }
ayr-audio-link-core = { path = "../ayr-audio-link-src/crates/ayr-audio-link-core" }

# Linux / macOS: Glow (OpenGL). Repo's visual baseline was tuned against
# Glow on Linux, and Wayland/X11 wgpu has its own quirks we haven't
# validated for this app.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# Polyphase / sinc-interpolated resampler for the headphone-monitor output
# path, only on non-Windows targets. On Windows we route through WASAPI
# shared mode with AUDCLNT_STREAMFLAGS_AUTOCONVERTPCM | SRC_DEFAULT_QUALITY,
# which is the same path OBS uses (the audio engine itself resamples to the
# device mix rate), so rubato isn't needed there.
rubato = "0.15"

# Windows: **wgpu only** — explicitly no `glow` feature.
#
# Compiling `glow` in pulls `opengl32.dll` (and `GLU32.dll`) as static
# link-time dependencies, which causes Windows' OpenGL loader to install
# the NVIDIA user-mode driver (`nvoglv64.dll`) into our process even
# though we pick `Renderer::Wgpu` at runtime. On a machine where
# another process is actively using the GPU — e.g. Battlefield 6 in
# borderless fullscreen — `nvoglv64.dll`'s init path recursively blows
# its own stack (`EXCEPTION_STACK_OVERFLOW` at offset ~+0xB1302B). The
# resulting SEH exception terminates our process before `eframe` can
# even invoke its creator callback, producing the user-visible
# "splash plays, app never launches" symptom.
#
# Dropping `glow` from the Windows feature set means `opengl32.dll` is
# never imported by our binary, so `nvoglv64.dll` never loads, so the
# crash never fires. The diagnostic trail that pinned this down (panic
# hook + SEH filter + periodic module-load tracer) lives in
# `src/startup_log.rs`.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
wasapi = "0.23"
# Registry access for:
#   - HKLM\SOFTWARE\Microsoft\Cryptography\MachineGuid (stable per-OS-install id,
#     one half of the device fingerprint in `src/license.rs`)
#   - HKCU\Software\AYR Audio\AudioMeter (trial-start timestamp stored redundantly
#     next to the JSON anchor for rollback resistance; we take the min of both).
winreg = "0.52"

[build-dependencies]
ico = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
