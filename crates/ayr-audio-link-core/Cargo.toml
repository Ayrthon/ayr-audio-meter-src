[package]
name = "ayr-audio-link-core"
version = "0.1.0"
edition = "2024"
description = "Shared wire format, mDNS discovery, and peer-identity helpers for AYR Audio Link (sender) and AYR Audio Meter (receiver)."
publish = false

[dependencies]
# Pure-Rust mDNS-SD client/server. Supports both advertising a service (used
# by the sender) and browsing for services (used by the meter) without any
# platform-specific Bonjour/Avahi linkage, which keeps both binaries 100%
# self-contained.
mdns-sd = "0.13"
# Fingerprinting peers: SHA-256 of (machine_guid | username) — same trick the
# meter already uses for its Lemon Squeezy device identity. Stored as the
# "stable identity" in the pairing trust cache so reconnects from the same
# receiver don't re-prompt the user on the sender side.
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
hostname = "0.4"
# Re-exported by mdns-sd as its event channel; we pattern-match on its
# timeout error in the browser's run-loop, so pin the same major.
flume = { version = "0.11", default-features = false }
# Lock-free mutex used for the shared list of discovered senders; matches the
# rest of the workspace so monomorphisations don't duplicate.
parking_lot = "0.12"

[dev-dependencies]
# Round-trip encode/decode tests run on a byte vector.
# (No extra dev deps required today; left here as the natural spot to add
# `pretty_assertions` if the test output becomes noisy.)
