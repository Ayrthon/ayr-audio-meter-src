[package]
name = "ayr-audio-link"
version = "0.1.0"
edition = "2024"
description = "AYR Audio Link sender — a free Windows companion app that streams an audio device over the LAN to AYR Audio Meter."
publish = false

[[bin]]
name = "ayr-audio-link"
path = "src/main.rs"

[dependencies]
ayr-audio-link-core = { path = "../ayr-audio-link-core" }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# HTTP client for the sender's own GitHub Releases auto-updater, reusing the
# same pattern the meter uses in `src/updater.rs`. Kept on default features
# (`tls` via rustls + webpki-roots, `json`, `gzip`) so HTTPS to GitHub works
# with zero per-platform TLS config.
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
# Audio capture on all platforms. Same crate + version the meter uses so the
# sender's device enumeration matches what the meter offers.
cpal = "0.17"
egui = "0.34"
# Same renderer split the meter uses — see the meter's Cargo.toml for the
# extensive comment on why we must NOT pull `glow` in on Windows.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
# Windows loopback capture + MachineGuid access (for the peer fingerprint).
wasapi = "0.23"
winreg = "0.52"
