# Default host `x86_64-pc-windows-gnullvm` links libunwind.dll unless the C runtime is static.
# That DLL is not on a stock Windows install, so end users see "libunwind.dll was not found".
# Static CRT bundles unwinding into the .exe (larger binary, no extra DLLs).
[target.x86_64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]

# Same issue if you build with the MinGW host triple.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]

# MSVC host: static-link the VC++ runtime so the installer does not have to ship or require
# the user-facing "Microsoft Visual C++ Redistributable". The resulting .exe is a few hundred
# kB larger but has zero external DLL dependencies beyond stock Windows components.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
